services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      AI_MODE: ${AI_MODE:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DECISION_MODEL: ${DECISION_MODEL:-typesafe/jev-1.13}
      CHAT_MODEL: ${CHAT_MODEL:-qwen/qwen3.7-flash}
      DATABASE_PATH: /app/data/tickets.db
    volumes:
      # Conserva los tickets y los embeddings indexados.
      - datos:/app/data
      # Evita descargar el modelo de embeddings en cada ejecución.
      - modelos:/app/node_modules/@huggingface/transformers/.cache

volumes:
  datos:
  modelos:
